# Publishes only the privacy/ folder to GitHub Pages, so the rest of the repo isn't served.
# Page URL: https://narezin.github.io/when2meet-autofill/privacy.html
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Publish privacy policy

on:
  push:
    branches: [main]
    paths: ["privacy/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy
      - id: deployment
        uses: actions/deploy-pages@v4
