# fly.toml app configuration file generated for screenshot2meet-api on 2026-10-17T13:49:57-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'screenshot2meet-api'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb' # change this if reading takes more than 1gb.
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
