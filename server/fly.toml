# fly.toml app configuration file generated for screenshot2meet-api on 2026-10-17T13:49:57-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'screenshot2meet-api'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # PaddleOCR peaks around 2.5 GB; 1 GB gets OOM-killed while loading models.
  memory = '4gb'
  # Dedicated core: shared CPUs get throttled after a few OCR runs and fills take minutes.
  cpu_kind = 'performance'
  cpus = 1
